name: Release build

# Called by Create release PR on the release branch before the pull request
# exists (D28). The release ships crates, which release-publish.yml uploads
# to crates.io after the merge; the GitHub release carries no files, so the
# build names the version and nothing else. ci.yml, which Create release PR
# runs on the same commit, packages every crate (cargo publish --dry-run).
on:
  workflow_call:
    inputs:
      version:
        description: The version being released.
        type: string
        required: true
      ref:
        description: The release branch head to build.
        type: string
        required: true

permissions:
  contents: read

jobs:
  release-version:
    name: Release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "Building v${VERSION} from ${REF}"
        env:
          VERSION: ${{ inputs.version }}
          REF: ${{ inputs.ref }}
