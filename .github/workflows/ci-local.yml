name: CI (shadcn-egui)

# The project's own CI jobs, called from ci.yml (D20). ri-ci-rust covers
# the workspace fmt and clippy with default features and the tests of the
# crates under "rust" in .github/repo-infra.json; everything else that
# CLAUDE.md lists as a gate runs here.
on:
  workflow_call:
    inputs:
      ref:
        description: The commit to check out; empty takes the commit that triggered the run (D28).
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Every workspace test, with default features and with --all-features.
  # The snapshot tests render through egui_kittest and wgpu and need a
  # Vulkan driver; the runner has no GPU, so mesa's software driver
  # (lavapipe) provides one.
  workspace-tests:
    name: Workspace tests (snapshots on lavapipe)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-tests-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tests-

      - name: Install the Vulkan software driver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1

      - name: Test with default features
        run: cargo test --locked --workspace --all-targets -- --test-threads 4

      - name: Test with all features
        run: cargo test --locked --workspace --all-targets --all-features -- --test-threads 4

      # --all-targets leaves doctests out; the skills' rust fences compile
      # only here (skill_docs in crates/shadcn-egui/src/lib.rs).
      - name: Doctests with default features
        run: cargo test --locked -p shadcn-egui --doc -- --test-threads 4

      - name: Doctests with all features
        run: cargo test --locked -p shadcn-egui --doc --all-features -- --test-threads 4

      # egui_kittest and the strict check (tests/common/strict.rs) write
      # <name>.new.png and <name>.diff.png next to a snapshot that does not
      # match. The gallery test keeps the README's
      # docs/gallery-screen.png that way too.
      - name: Keep the failed snapshot images
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-diffs
          path: |
            crates/*/tests/snapshots/**/*.new.png
            crates/*/tests/snapshots/**/*.diff.png
            docs/*.new.png
            docs/*.diff.png
          if-no-files-found: ignore

  clippy-all-features:
    name: Clippy with all features
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-

      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  # The browser gallery (scripts/build-web-gallery.sh). The workspace
  # clippy runs build for the host, where the wasm entry point of the
  # gallery example is compiled out, so it is linted here. The site is
  # uploaded so a reviewer can serve a pull request's gallery.
  web-gallery:
    name: Web gallery build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Install the wasm-bindgen CLI
        run: |
          scripts/install-wasm-bindgen.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - run: cargo clippy --locked -p shadcn-egui --target wasm32-unknown-unknown --example gallery --features fonts-all,icons-all -- -D warnings

      - run: scripts/build-web-gallery.sh site

      - uses: actions/upload-artifact@v7
        with:
          name: web-gallery
          path: site
          retention-days: 7

  # The generators are workspaces of their own and never dependencies of a
  # crate, so the workspace jobs do not see them.
  tools:
    name: Tool ${{ matrix.tool }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tool: [stylegen, icongen, fontgen]
    env:
      MANIFEST: tools/${{ matrix.tool }}/Cargo.toml
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/${{ matrix.tool }}/target
          key: ${{ runner.os }}-cargo-${{ matrix.tool }}-${{ hashFiles(format('tools/{0}/Cargo.lock', matrix.tool)) }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.tool }}-

      - run: cargo fmt --check --manifest-path "$MANIFEST"
      - run: cargo clippy --locked --all-targets --manifest-path "$MANIFEST" -- -D warnings
      - run: cargo test --locked --manifest-path "$MANIFEST"

  # stylegen drift compares the crate's style comments and the copied
  # upstream files with shadcn-svelte at tools/stylegen/PIN and shadcn/ui at
  # tools/stylegen/PIN_REACT. It clones about 300 MB, and its result
  # changes only with what it reads: tools/stylegen/ (the pins, markers.txt,
  # the fixtures, the drift code) and the `// base: "…"` quotes in the
  # crate's src/components/ and src/layout.rs. So it runs only when a push
  # or a pull request changes one of those. Any other event, and any case
  # where the step cannot tell (a new branch, a commit it cannot fetch),
  # runs it.
  stylegen-drift:
    name: Styles match the pinned upstream
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # A called workflow sees the caller's event, so this is the push or
      # pull request that started ci.yml. Comparing two trees needs only the
      # two commits, not the history between them.
      - name: Did the drift inputs change?
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ inputs.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          decide() { echo "changed=$1" >> "$GITHUB_OUTPUT"; echo "drift inputs changed: $1 ($2)"; }
          base='' head=''
          if [ -z "$REF" ] && [ "$EVENT" = pull_request ]; then
            base=$PR_BASE head=$PR_HEAD
          elif [ -z "$REF" ] && [ "$EVENT" = push ]; then
            base=$PUSH_BEFORE head=$PUSH_AFTER
          fi
          case "$base" in
            ''|*[!0-9a-f]*|0000000000000000000000000000000000000000)
              decide true "no base commit for event $EVENT${REF:+ with ref $REF}"; exit 0 ;;
          esac
          if ! git fetch --quiet --no-tags --depth=1 origin "$base" "$head"; then
            decide true "cannot fetch $base and $head"; exit 0
          fi
          rc=0
          git diff --quiet "$base" "$head" -- tools/stylegen/ \
            crates/shadcn-egui/src/components/ crates/shadcn-egui/src/layout.rs || rc=$?
          case $rc in
            0) decide false "$base..$head" ;;
            1) decide true "$base..$head" ;;
            *) decide true "cannot compare $base and $head" ;;
          esac

      - if: steps.gate.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@stable

      - if: steps.gate.outputs.changed == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/stylegen/target
          key: ${{ runner.os }}-cargo-stylegen-${{ hashFiles('tools/stylegen/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-stylegen-

      - name: Check out the pinned upstreams
        if: steps.gate.outputs.changed == 'true'
        run: |
          set -euo pipefail
          up="$RUNNER_TEMP/upstream"
          git clone --quiet --filter=blob:none --no-checkout https://github.com/huntabyte/shadcn-svelte.git "$up/svelte"
          git -C "$up/svelte" checkout --quiet "$(cat tools/stylegen/PIN)"
          git clone --quiet --filter=blob:none --no-checkout https://github.com/shadcn-ui/ui.git "$up/react"
          git -C "$up/react" checkout --quiet "$(cat tools/stylegen/PIN_REACT)"

      - if: steps.gate.outputs.changed == 'true'
        run: cargo run --locked --manifest-path tools/stylegen/Cargo.toml -- drift "$RUNNER_TEMP/upstream/svelte" "$RUNNER_TEMP/upstream/react" .

  # What each crate would upload to crates.io, and whether the workspace
  # publishes (RELEASING.md, "Checks before a release").
  packages:
    name: Crate packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@stable

      # Not ~/.cargo/registry/src or target/package: the dry run unpacks the
      # workspace's own crates there under their current version, and cargo
      # reuses an unpacked copy left by an earlier run of the same version,
      # so a changed crate would be verified against its old source. The
      # libraries it built from them stay in target; check-publish.sh
      # removes those before the run.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            !target/package
          key: ${{ runner.os }}-cargo-packages-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-packages-v2-

      - run: scripts/check-version-files.sh
      - run: scripts/check-packages.sh
      - run: scripts/check-package-size.sh
      - run: scripts/check-publish.sh
