[package]
name = "icongen"
version = "0.1.0"
edition = "2021"
description = "Convert stroked SVG icons (e.g. Lucide) into shadcn_egui icon constants"
license = "MIT"
publish = false

# Its own workspace: this tool never becomes a dependency of shadcn_egui or of
# any project that vendors the registry.
[workspace]

[dependencies]
# Text and font support are off: icons are paths only.
usvg = { version = "0.48", default-features = false }
