shadcn-egui-font-space-grotesk = { path = "crates/shadcn-egui-font-space-grotesk", version = "0.5.0" }
shadcn-egui-font-montserrat = { path = "crates/shadcn-egui-font-montserrat", version = "0.5.0" }
