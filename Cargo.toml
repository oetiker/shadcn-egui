shadcn-egui-font-geist-mono = { path = "crates/shadcn-egui-font-geist-mono", version = "0.5.0" }
shadcn-egui-font-lora = { path = "crates/shadcn-egui-font-lora", version = "0.5.0" }
shadcn-egui-font-merriweather = { path = "crates/shadcn-egui-font-merriweather", version = "0.5.0" }
shadcn-egui-font-playfair-display = { path = "crates/shadcn-egui-font-playfair-display", version = "0.5.0" }
