[workspace]
resolver = "2"
members = ["crates/*"]
# tools/stylegen, tools/icongen (and tools/fontgen from Phase 7) are their
# own workspaces and never dependencies of any crate here.
exclude = ["tools"]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/oetiker/shadcn-egui"

[workspace.dependencies]
egui = "0.34"
egui_extras = { version = "0.34", default-features = false }
log = "0.4"
shadcn-egui-core = { path = "crates/shadcn-egui-core", version = "0.5.0" }
# BEGIN fontgen
shadcn-egui-font-inter = { path = "crates/shadcn-egui-font-inter", version = "0.5.0" }
shadcn-egui-font-noto-sans = { path = "crates/shadcn-egui-font-noto-sans", version = "0.5.0" }
shadcn-egui-font-nunito-sans = { path = "crates/shadcn-egui-font-nunito-sans", version = "0.5.0" }
shadcn-egui-font-figtree = { path = "crates/shadcn-egui-font-figtree", version = "0.5.0" }
shadcn-egui-font-roboto = { path = "crates/shadcn-egui-font-roboto", version = "0.5.0" }
shadcn-egui-font-raleway = { path = "crates/shadcn-egui-font-raleway", version = "0.5.0" }
shadcn-egui-font-dm-sans = { path = "crates/shadcn-egui-font-dm-sans", version = "0.5.0" }
shadcn-egui-font-public-sans = { path = "crates/shadcn-egui-font-public-sans", version = "0.5.0" }
shadcn-egui-font-outfit = { path = "crates/shadcn-egui-font-outfit", version = "0.5.0" }
