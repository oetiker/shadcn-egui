shadcn-egui-font-roboto = { path = "crates/shadcn-egui-font-roboto", version = "0.8.0" }
shadcn-egui-font-raleway = { path = "crates/shadcn-egui-font-raleway", version = "0.8.0" }
shadcn-egui-font-dm-sans = { path = "crates/shadcn-egui-font-dm-sans", version = "0.8.0" }
